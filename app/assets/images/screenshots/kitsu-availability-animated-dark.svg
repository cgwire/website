<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 792 520" width="1440" height="945" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#dcddde" role="img" aria-label="Monitoring dashboard of a Kitsu instance: CPU, load, memory and disk gauges, uptime, and the CPU and memory charts of the last 24 hours">
  <!-- 9s loop: a CPU peak shows up on the chart and the gauge, an alert is sent to the team, then the instance is back to normal -->
  <style>
    .calm { animation: calm 9s ease-out infinite }
    .busy { opacity: 0; animation: busy 9s ease-out infinite }
    .spike { opacity: 0; animation: spike 9s ease-out infinite }
    .quiet { animation: quiet 9s ease-out infinite }
    .alert { opacity: 0; animation: alert 9s ease-out infinite }
    .resolved { opacity: 0; animation: resolved 9s ease-out infinite }
    @keyframes calm { 0%, 28% { opacity: 1 } 32%, 56% { opacity: 0 } 60%, 100% { opacity: 1 } }
    @keyframes busy { 0%, 28% { opacity: 0 } 32%, 56% { opacity: 1 } 60%, 100% { opacity: 0 } }
    @keyframes spike { 0%, 28% { opacity: 0 } 32%, 92% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes quiet { 0%, 28% { opacity: 1 } 32%, 92% { opacity: 0 } 97%, 100% { opacity: 1 } }
    @keyframes alert { 0%, 33% { opacity: 0; transform: translateY(-4px) } 37%, 56% { opacity: 1; transform: translateY(0) } 60%, 100% { opacity: 0; transform: translateY(0) } }
    @keyframes resolved { 0%, 58% { opacity: 0 } 62%, 92% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .calm, .busy, .spike, .quiet, .alert, .resolved { animation: none } .spike, .resolved { opacity: 1 } .quiet { opacity: 0 } }
  </style>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity=".45"/></filter>
    <clipPath id="clip-cpu"><rect x="84" y="244" width="299" height="180"/></clipPath>
  </defs>
  <rect x="16" y="16" width="768" height="484" rx="12" fill="#36393f" filter="url(#card-shadow)"/>
  <!-- Gauges -->
  <path d="M42 39l4 4 4-4" fill="none" stroke="#dcddde" stroke-opacity=".7" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="46" font-weight="700">Quick CPU / Mem / Disk</text>
  <g class="alert"><rect x="634" y="31" width="126" height="20" rx="10" fill="#ff0005"/><text x="697" y="44.6" fill="#fff" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle">ALERT · CPU 92%</text></g>
  <g class="resolved"><rect x="674" y="31" width="86" height="20" rx="10" fill="#00b738"/><text x="717" y="44.6" fill="#fff" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle">RESOLVED</text></g>
  <rect x="40.500" y="58.500" width="136" height="110" rx="6" fill="#3a3d43" stroke="#4e5159"/><text x="108" y="79" font-size="11.500" font-weight="700" text-anchor="middle">CPU Busy</text><path d="M82.02 147.00A30 30 0 1 1 133.98 147.00" fill="none" stroke="#4e5159" stroke-width="8"/><g class="calm"><path d="M82.02 147.00A30 30 0 1 1 133.98 147.00" fill="none" stroke="#00b738" stroke-width="8" stroke-dasharray="6.0 200"/><text x="108.0" y="139" fill="#00b738" font-size="15" font-weight="700" text-anchor="middle">4.8%</text></g><g class="busy"><path d="M82.02 147.00A30 30 0 1 1 133.98 147.00" fill="none" stroke="#ff0005" stroke-width="8" stroke-dasharray="115.6 200"/><text x="108.0" y="139" fill="#ff0005" font-size="15" font-weight="700" text-anchor="middle">92%</text></g>
  <rect x="186.500" y="58.500" width="136" height="110" rx="6" fill="#3a3d43" stroke="#4e5159"/><text x="254" y="79" font-size="11.500" font-weight="700" text-anchor="middle">Sys Load (5m avg)</text><path d="M228.02 147.00A30 30 0 1 1 279.98 147.00" fill="none" stroke="#4e5159" stroke-width="8"/><g><path d="M228.02 147.00A30 30 0 1 1 279.98 147.00" fill="none" stroke="#00b738" stroke-width="8" stroke-dasharray="16.3 200"/><text x="254.0" y="139" fill="#00b738" font-size="15" font-weight="700" text-anchor="middle">13%</text></g>
  <rect x="332.500" y="58.500" width="136" height="110" rx="6" fill="#3a3d43" stroke="#4e5159"/><text x="400" y="79" font-size="11.500" font-weight="700" text-anchor="middle">RAM Used</text><path d="M374.02 147.00A30 30 0 1 1 425.98 147.00" fill="none" stroke="#4e5159" stroke-width="8"/><g><path d="M374.02 147.00A30 30 0 1 1 425.98 147.00" fill="none" stroke="#00b738" stroke-width="8" stroke-dasharray="84.2 200"/><text x="400.0" y="139" fill="#00b738" font-size="15" font-weight="700" text-anchor="middle">67%</text></g>
  <rect x="478.500" y="58.500" width="136" height="110" rx="6" fill="#3a3d43" stroke="#4e5159"/><text x="546" y="79" font-size="11.500" font-weight="700" text-anchor="middle">Root FS Used</text><path d="M520.02 147.00A30 30 0 1 1 571.98 147.00" fill="none" stroke="#4e5159" stroke-width="8"/><g><path d="M520.02 147.00A30 30 0 1 1 571.98 147.00" fill="none" stroke="#00b738" stroke-width="8" stroke-dasharray="75.0 200"/><text x="546.0" y="139" fill="#00b738" font-size="15" font-weight="700" text-anchor="middle">59.7%</text></g>
  <rect x="624.500" y="58.500" width="136" height="110" rx="6" fill="#3a3d43" stroke="#4e5159"/><text x="692" y="79" font-size="11.500" font-weight="700" text-anchor="middle">Uptime</text><text x="692" y="131" fill="#00b738" font-size="20" font-weight="700" text-anchor="middle">3.1 weeks</text>

  <!-- Charts -->
  <path d="M42 189l4 4 4-4" fill="none" stroke="#dcddde" stroke-opacity=".7" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="196" font-weight="700">Basic CPU / Mem / Net / Disk</text>
  <rect x="40.500" y="208.500" width="355" height="268" rx="6" fill="#3a3d43" stroke="#4e5159"/>
  <rect x="405.500" y="208.500" width="355" height="268" rx="6" fill="#3a3d43" stroke="#4e5159"/>
  <g font-size="11.500" font-weight="700" text-anchor="middle"><text x="218" y="229">CPU Basic</text><text x="583" y="229">Memory Basic</text></g>
  <g stroke="#4e5159"><path d="M84 244.500H383"/><path d="M84 334.500H383"/><path d="M84 424.500H383"/><path d="M449 244.500H748"/><path d="M449 334.500H748"/><path d="M449 424.500H748"/></g>
  <g font-size="10" fill-opacity=".6" text-anchor="end">
    <text x="78" y="248">100%</text><text x="78" y="338">50%</text><text x="78" y="428">0%</text>
    <text x="443" y="248">2 GiB</text><text x="443" y="338">1 GiB</text><text x="443" y="428">0</text>
  </g>
  <g font-size="10" fill-opacity=".6" text-anchor="middle"><text x="100" y="442">14:00</text><text x="465" y="442">14:00</text><text x="153" y="442">18:00</text><text x="518" y="442">18:00</text><text x="206" y="442">22:00</text><text x="571" y="442">22:00</text><text x="259" y="442">02:00</text><text x="624" y="442">02:00</text><text x="312" y="442">06:00</text><text x="677" y="442">06:00</text><text x="365" y="442">10:00</text><text x="730" y="442">10:00</text></g>

  <path d="M84 280.0H383" stroke="#ff0005" stroke-opacity=".6" stroke-dasharray="4 4"/>
  <g clip-path="url(#clip-cpu)" fill="none" stroke-width="1.600" stroke-linejoin="round">
    <polyline points="84,416.8 122,415.0 128,370.0 132,415.0 180,416.8 184,407.8 188,416.8 202,415.0 206,362.8 210,415.0 250,416.8 254,404.2 258,416.8 298,415.0 302,380.8 306,415.0 320,416.8 346,415.0" stroke="#00b738"/>
    <polyline class="quiet" points="346,415.0 383,416.8" stroke="#00b738"/>
    <g class="spike"><polygon points="346,415.0 352,319.6 357,258.4 363,262.0 368,296.2 374,386.2 378,415.0 383,416.8 383,424 346,424" fill="#ff0005" fill-opacity=".15" stroke="none"/><polyline points="346,415.0 352,319.6 357,258.4 363,262.0 368,296.2 374,386.2 378,415.0 383,416.8" stroke="#ff0005"/></g>
  </g>
  <polygon points="449,424 449,325.0 537,325.0 539,321.4 543,325.0 609,325.0 611,330.4 615,325.0 699,325.0 703,319.6 748,321.4 748,424" fill="#00b738" fill-opacity=".22"/>
  <polygon points="449,265.6 493,262.0 495,271.0 559,265.6 609,262.0 611,274.6 679,267.4 699,263.8 701,272.8 748,269.2 748,321.4 703,319.6 699,325.0 615,325.0 611,330.4 609,325.0 543,325.0 539,321.4 537,325.0 449,325.0" fill="#9ea0fa" fill-opacity=".18"/>
  <g fill="none" stroke-width="1.600" stroke-linejoin="round"><polyline points="449,325.0 537,325.0 539,321.4 543,325.0 609,325.0 611,330.4 615,325.0 699,325.0 703,319.6 748,321.4" stroke="#00b738"/><polyline points="449,265.6 493,262.0 495,271.0 559,265.6 609,262.0 611,274.6 679,267.4 699,263.8 701,272.8 748,269.2" stroke="#9ea0fa"/></g>

  <g font-size="10.500" fill-opacity=".75">
    <rect x="56" y="456" width="12" height="3" fill="#00b738"/><text x="74" y="461.500">Busy</text>
    <path d="M118 457.500h12" stroke="#ff0005" stroke-dasharray="4 2" fill="none"/><text x="136" y="461.500">Alert threshold</text>
    <rect x="421" y="456" width="12" height="3" fill="#00b738"/><text x="439" y="461.500">RAM Used</text>
    <rect x="504" y="456" width="12" height="3" fill="#9ea0fa"/><text x="522" y="461.500">Cache + Buffer</text>
  </g>
</svg>
