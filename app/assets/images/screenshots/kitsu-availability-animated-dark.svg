    <path stroke="#00b738" d="m346 415 37 1.8" class="quiet"/>
    <g class="spike">
      <path fill="#ff0005" fill-opacity=".15" d="m346 415 6-95.4 5-61.2 6 3.6 5 34.2 6 90 4 28.8 5 1.8v7.2h-37z"/>
      <path stroke="#ff0005" d="m346 415 6-95.4 5-61.2 6 3.6 5 34.2 6 90 4 28.8 5 1.8"/>
