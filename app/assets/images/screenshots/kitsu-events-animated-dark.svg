    <rect x="44" y="206" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:39:26</text><rect x="190" y="206" width="128" height="22" rx="11" fill="#92a9fa" fill-opacity=".14"/><text x="254" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#92a9fa">update</text><rect x="326" y="206" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="221" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">task</text><rect x="430" y="206" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="221" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">SH03</text>
    <rect x="47" y="248" width="3" height="72" fill="#ccc"/><text x="62" y="265" font-weight="600">user</text><use href="#gwen" x="232" y="250" width="20" height="20"/><text x="260" y="265">Gwenaelle Dupré</text><text x="62" y="289" font-weight="600">project_id</text><text x="232" y="289">298971ec-bd44-4b65-aa28-f82cf98dd99f</text><text x="62" y="313" font-weight="600">task_id</text><text x="232" y="313">f9f1f6da-a649-42db-af93-088b496ff9aa</text>
    <rect x="44" y="344" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="359" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:39:25</text><rect x="190" y="344" width="128" height="22" rx="11" fill="#4cd987" fill-opacity=".14"/><text x="254" y="359" text-anchor="middle" font-size="12" font-weight="600" fill="#4cd987">new</text><rect x="326" y="344" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="359" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">comment</text><rect x="430" y="344" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="359" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">SH03</text>
    <rect x="44" y="374" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:31:04</text><rect x="190" y="374" width="128" height="22" rx="11" fill="#f0b057" fill-opacity=".14"/><text x="254" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#f0b057">annotation-update</text><rect x="326" y="374" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="389" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">preview-file</text><rect x="430" y="374" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="389" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">Critter Evolved</text>
    <rect x="44" y="404" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="419" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:24:47</text><rect x="190" y="404" width="128" height="22" rx="11" fill="#5fd3d3" fill-opacity=".14"/><text x="254" y="419" text-anchor="middle" font-size="12" font-weight="600" fill="#5fd3d3">assign</text><rect x="326" y="404" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">task</text><rect x="430" y="404" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">Critter Evolved</text>
    <rect x="44" y="434" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:24:12</text><rect x="190" y="434" width="128" height="22" rx="11" fill="#92a9fa" fill-opacity=".14"/><text x="254" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#92a9fa">update</text><rect x="326" y="434" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="449" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">shot</text><rect x="430" y="434" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="449" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">SH03</text>
    <rect x="44" y="464" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:18:30</text><rect x="190" y="464" width="128" height="22" rx="11" fill="#4cd987" fill-opacity=".14"/><text x="254" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#4cd987">new</text><rect x="326" y="464" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="479" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">shot</text><rect x="430" y="464" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="479" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">Critter Evolved</text>
    </g>
    <g class="first"><rect class="pulse" x="38" y="171" width="516" height="32" rx="8" fill="#36393f" stroke="#00b242" stroke-width="1.5" filter="url(#sel-shadow)"/><rect x="44" y="176" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:42:08</text><rect x="190" y="176" width="128" height="22" rx="11" fill="#ff8fd0" fill-opacity=".14"/><text x="254" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#ff8fd0">status-changed</text><rect x="326" y="176" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="191" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">task</text><rect x="430" y="176" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="191" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">SH03</text></g>
    <g class="second"><rect class="pulse" x="38" y="171" width="516" height="32" rx="8" fill="#36393f" stroke="#00b242" stroke-width="1.5" filter="url(#sel-shadow)"/><rect x="44" y="176" width="138" height="22" rx="4" fill="#25282e"/><text x="113" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#fefefe">2026-11-20 17:42:09</text><rect x="190" y="176" width="128" height="22" rx="11" fill="#4cd987" fill-opacity=".14"/><text x="254" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#4cd987">new</text><rect x="326" y="176" width="96" height="22" rx="11" fill="#25282e"/><text x="374" y="191" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">preview-file</text><rect x="430" y="176" width="118" height="22" rx="11" fill="#25282e"/><text x="489" y="191" text-anchor="middle" font-size="12" font-weight="400" fill="#fefefe">Critter Evolved</text></g>
  </g>
</svg>
