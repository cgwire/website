<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 792 520" width="1440" height="945" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#dcddde" role="img" aria-label="Kitsu activity logs: every event of the studio listed live, with its date, action, object and the production or shot it is about">
  <!-- 9s loop: a status change then a new preview arrive at the top of the logs, the older events move down -->
  <style>
    .older { animation: older 9s ease-in-out infinite }
    .first, .second { opacity: 0; animation: 9s ease-out infinite }
    .first { animation-name: first } .second { animation-name: second }
    .pulse { opacity: 0; animation: 9s ease-out infinite }
    .first .pulse { animation-name: pulse1 } .second .pulse { animation-name: pulse2 }
    .count { opacity: 0; animation: 9s linear infinite }
    .c12 { animation-name: c12 } .c13 { animation-name: c13 } .c14 { animation-name: c14 }
    @keyframes older { 0%, 18% { transform: translateY(0) } 23%, 50% { transform: translateY(30px) } 55%, 93% { transform: translateY(60px) } 100% { transform: translateY(0) } }
    @keyframes first { 0%, 21% { opacity: 0; transform: translateY(-6px) } 26%, 50% { opacity: 1; transform: translateY(0) } 55%, 93% { opacity: 1; transform: translateY(30px) } 97%, 100% { opacity: 0; transform: translateY(30px) } }
    @keyframes second { 0%, 53% { opacity: 0; transform: translateY(-6px) } 58%, 93% { opacity: 1; transform: translateY(0) } 97%, 100% { opacity: 0; transform: translateY(0) } }
    @keyframes pulse1 { 0%, 25% { opacity: 0 } 27%, 38% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes pulse2 { 0%, 57% { opacity: 0 } 59%, 72% { opacity: 1 } 86%, 100% { opacity: 0 } }
    @keyframes c12 { 0%, 22% { opacity: 1 } 23%, 96% { opacity: 0 } 97%, 100% { opacity: 1 } }
    @keyframes c13 { 0%, 22% { opacity: 0 } 23%, 54% { opacity: 1 } 55%, 100% { opacity: 0 } }
    @keyframes c14 { 0%, 54% { opacity: 0 } 55%, 96% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .older, .first, .second, .pulse, .count { animation: none }
      .older { transform: translateY(60px) } .first { opacity: 1; transform: translateY(30px) } .second, .c14 { opacity: 1 }
    }
  </style>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity=".45"/></filter>
    <filter id="sel-shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00b242" flood-opacity=".35"/></filter>
    <clipPath id="clip-list"><rect x="16" y="168" width="768" height="324"/></clipPath>
    <clipPath id="clip-avatar"><circle cx="30" cy="30" r="30"/></clipPath>
    <symbol id="gwen" viewBox="0 0 60 60"><g clip-path="url(#clip-avatar)"><image href="data:image/jpeg;base64," width="60" height="60" preserveAspectRatio="xMidYMid slice"/></g></symbol>
  </defs>
  <rect x="16" y="16" width="768" height="484" rx="12" fill="#36393f" filter="url(#card-shadow)"/>

  <!-- Tabs -->
  <rect x="40" y="62" width="720" height="1" fill="#4e5159"/>
  <text x="52" y="50" font-size="14" font-weight="600">Activity Logs</text>
  <rect x="40" y="61" width="108" height="2" fill="#9ea0fa"/>
  <text x="172" y="50" font-size="14" fill="#eeeeee">Login Logs</text>
  <text x="270" y="50" font-size="14" fill="#eeeeee">Preview Files</text>

  <!-- Filters -->
  <text x="40" y="88" font-size="10" font-weight="700" letter-spacing="1" fill="#eeeeee">DATE RANGE</text>
  <rect x="40.5" y="96.5" width="200" height="36" rx="8" fill="#36393f" stroke="#4e5159"/>
  <text x="54" y="119">2026-11-16 - 2026-11-20</text>
  <text x="256" y="88" font-size="10" font-weight="700" letter-spacing="1" fill="#eeeeee">USERS</text>
  <rect x="256.5" y="96.5" width="240" height="36" rx="8" fill="#36393f" stroke="#4e5159"/>
  <text x="270" y="119" fill="#72767d">All users</text>

  <!-- Event count: one text per state -->
  <g font-style="italic" fill="#7a7a7a">
    <text class="count c12" x="52" y="160">846 events listed</text>
    <text class="count c13" x="52" y="160">847 events listed</text>
    <text class="count c14" x="52" y="160">848 events listed</text>
  </g>

  <!-- Events: the two arrivals, then the events already listed -->
  <g clip-path="url(#clip-list)">
    <g class="older">
