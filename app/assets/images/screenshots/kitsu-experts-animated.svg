<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 792 520" width="1440" height="945" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#363636" role="img" aria-label="Career of a CGWire support team member: head of production, production supervisor and technical director in animation studios">
  <!-- 8s loop: the focus walks through the career, from the first production job to head of production -->
  <style>
    .step { opacity: 0; animation: 8s ease-in-out infinite }
    .s1 { animation-name: s1 } .s2 { animation-name: s2 } .s3 { animation-name: s3 } .s4 { animation-name: s4 }
    @keyframes s1 { 0%, 2% { opacity: 0 } 6%, 22% { opacity: 1 } 26%, 100% { opacity: 0 } }
    @keyframes s2 { 0%, 24% { opacity: 0 } 28%, 46% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes s3 { 0%, 48% { opacity: 0 } 52%, 70% { opacity: 1 } 74%, 100% { opacity: 0 } }
    @keyframes s4 { 0%, 72% { opacity: 0 } 76%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none } .s4 { opacity: 1 } }
  </style>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#363636" flood-opacity=".14"/></filter>
    <filter id="sel-shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00b242" flood-opacity=".35"/></filter>
    <clipPath id="clip-unit"><rect width="48" height="33" rx="3"/></clipPath>
    <clipPath id="clip-zodiak"><rect width="46" height="46" rx="3"/></clipPath>
    <clipPath id="clip-marathon"><rect width="48" height="48" rx="3"/></clipPath>
    <symbol id="unit" viewBox="0 0 48 33"><g clip-path="url(#clip-unit)"><image href="data:image/webp;base64," width="48" height="33" preserveAspectRatio="xMidYMid slice"/></g></symbol>
    <symbol id="zodiak" viewBox="0 0 46 46"><g clip-path="url(#clip-zodiak)"><image href="data:image/webp;base64," width="46" height="46" preserveAspectRatio="xMidYMid slice"/></g></symbol>
    <symbol id="marathon" viewBox="0 0 48 48"><g clip-path="url(#clip-marathon)"><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwAgMAAAAqbBEUAAAADFBMVEXn4tyds8h4j6VWaHp0dmfGAAAAHklEQVQoz2NgoDpgDQWBgFEOKRyuVavW////ddhzALSPm2WDDUGgAAAAAElFTkSuQmCC" width="48" height="48" preserveAspectRatio="xMidYMid slice"/></g></symbol>
  </defs>
  <rect x="16" y="16" width="768" height="484" rx="12" fill="#fff" filter="url(#card-shadow)"/>
  <text x="170" y="62" font-size="18" font-weight="700">Experience</text>

  <use href="#unit" x="170" y="86" width="48" height="33"/>
  <text x="234" y="98" font-size="15" font-weight="700">UNIT IMAGE</text>
  <text x="234" y="116" font-size="12.500">1 yr 7 mos</text>
  <text x="234" y="133" font-size="12.500" fill-opacity=".6">Paris Region, France</text>
  <path d="M194 166V214" stroke="#dbdbdb" stroke-width="1.500"/>
  <circle cx="194" cy="162" r="4" fill="#b0b0b0"/>
  <circle cx="194" cy="218" r="4" fill="#b0b0b0"/>
  <text x="234" y="166" font-size="14.500" font-weight="700">Head of production</text>
  <text x="234" y="184" font-size="12.500" fill-opacity=".6">Sep 2017 - May 2018 - 9 mos</text>
  <text x="234" y="222" font-size="14.500" font-weight="700">Production Supervisor</text>
  <text x="234" y="240" font-size="12.500" fill-opacity=".6">Nov 2016 - Aug 2017 - 10 mos</text>

  <path d="M170 262.500H622" stroke="#e6e6e6"/>
  <use href="#zodiak" x="171" y="278" width="46" height="46"/>
  <text x="234" y="290" font-size="14.500" font-weight="700">Technical Director</text>
  <text x="234" y="308" font-size="12.500">Zodiak Kids Studios</text>
  <text x="234" y="325" font-size="12.500" fill-opacity=".6">Jan 2016 - Oct 2016 - 10 mos</text>
  <text x="234" y="342" font-size="12.500" fill-opacity=".6">Neuilly-sur-Seine</text>

  <path d="M170 360.500H622" stroke="#e6e6e6"/>
  <use href="#marathon" x="170" y="376" width="48" height="48"/>
  <text x="234" y="388" font-size="14.500" font-weight="700">Production Supervisor</text>
  <text x="234" y="406" font-size="12.500">Marathon Media</text>
  <text x="234" y="423" font-size="12.500" fill-opacity=".6">Apr 2014 - Jan 2016 - 1 yr 10 mos</text>
  <text x="234" y="440" font-size="12.500" fill-opacity=".6">Paris Area, France</text>
  <text x="234" y="462" font-size="12.500">Lolirock (seasons 1 &amp; 2), Get Blake</text>

  <!-- Focus -->
  <g fill="none" stroke="#00b242" stroke-width="1.600" filter="url(#sel-shadow)">
    <rect class="step s1" x="158" y="366" width="476" height="110" rx="8"/>
    <rect class="step s2" x="158" y="268" width="476" height="86" rx="8"/>
    <rect class="step s3" x="222" y="202" width="412" height="50" rx="8"/>
    <rect class="step s4" x="222" y="146" width="412" height="50" rx="8"/>
  </g>
</svg>
