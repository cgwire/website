<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 792 520" width="1440" height="945" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#dcddde" role="img" aria-label="Kitsu feedback board: feature requests posted by studios, sorted by votes, with their review status">
  <!-- 8s loop: a request gets one more vote, then moves from under review to planned -->
  <style>
    .before { animation: before 8s ease-out infinite }
    .after { opacity: 0; animation: after 8s ease-out infinite }
    .review { animation: review 8s ease-out infinite }
    .planned { opacity: 0; animation: planned 8s ease-out infinite }
    @keyframes before { 0%, 18% { opacity: 1 } 22%, 96% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes after { 0%, 18% { opacity: 0 } 22%, 94% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes review { 0%, 48% { opacity: 1 } 52%, 96% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes planned { 0%, 50% { opacity: 0 } 55%, 94% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .before, .after, .review, .planned { animation: none } .before, .review { opacity: 0 } .after, .planned { opacity: 1 } }
  </style>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity=".45"/></filter>
    <filter id="sel-shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00b242" flood-opacity=".35"/></filter>
  </defs>
  <rect x="16" y="16" width="768" height="484" rx="12" fill="#36393f" filter="url(#card-shadow)"/>

  <!-- Tabs -->
  <g font-size="14">
    <text x="48" y="43" fill-opacity=".6">Roadmap</text>
    <text x="136" y="43" fill="#00b242" font-weight="700">Feedback</text>
    <text x="226" y="43" fill-opacity=".6">Changelog</text>
  </g>
  <path d="M16 58.500H784" stroke="#4e5159"/>

  <!-- Boards -->
  <text x="52" y="92" font-size="10.500" font-weight="700" letter-spacing="1" fill-opacity=".6">BOARDS</text>
  <rect x="40" y="104" width="204" height="30" rx="6" fill="#40444b"/>
  <text x="52" y="124" font-weight="700">Asset and Shot Tables</text><text x="52" y="152" fill-opacity=".75">Casting</text><text x="52" y="180" fill-opacity=".75">General</text><text x="52" y="208" fill-opacity=".75">Integration</text><text x="52" y="236" fill-opacity=".75">People</text><text x="52" y="264" fill-opacity=".75">Production report</text><text x="52" y="292" fill-opacity=".75">Review</text><text x="52" y="320" fill-opacity=".75">Schedule</text><text x="52" y="348" fill-opacity=".75">Task Tables</text>

  <!-- New post -->
  <text x="270" y="94" font-size="15" font-weight="700">Asset and Shot Tables</text>
  <rect x="270.500" y="108.500" width="482" height="52" rx="8" fill="#36393f" stroke="#4e5159"/>
  <text x="286" y="139" fill-opacity=".45">Short, descriptive title</text>
  <rect x="648" y="119" width="92" height="31" rx="6" fill="#00b242"/>
  <text x="694" y="139" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Create Post</text>

  <!-- Posts -->
  <rect x="270.500" y="176.500" width="482" height="300" rx="8" fill="#36393f" stroke="#4e5159"/>
  <text x="286" y="207">Showing <tspan font-weight="700">Top</tspan> posts</text>
  <rect x="612.500" y="188.500" width="128" height="28" rx="6" fill="#36393f" stroke="#4e5159"/>
  <g fill="none" stroke="#dcddde" stroke-opacity=".55" stroke-width="1.400" stroke-linecap="round"><circle cx="628" cy="201.500" r="4"/><path d="M631 204.500l3.500 3.500"/></g>
  <text x="642" y="207" font-size="12" fill-opacity=".45">Search...</text>
  <path d="M270.500 228.500H752.500" stroke="#4e5159"/>
  <text x="286" y="252" font-weight="700">Allow task types to have their own statuses</text>
  <text x="286" y="269" font-size="12" fill-opacity=".65">During a production the number of task statuses keeps growing,</text><text x="286" y="284" font-size="12" fill-opacity=".65">but each task type only uses a few of them.</text>
  <path d="M288 293h9a1.500 1.500 0 0 1 1.500 1.500v5a1.500 1.500 0 0 1-1.500 1.500h-5l-3 2.500v-2.500h-1a1.500 1.500 0 0 1-1.500-1.500v-5a1.500 1.500 0 0 1 1.500-1.500Z" fill="none" stroke="#dcddde" stroke-opacity=".55" stroke-width="1.200" stroke-linejoin="round"/><text x="304" y="302" font-size="11.500" fill-opacity=".65">3</text>
  <rect x="700.500" y="247.500" width="40" height="46" rx="6" fill="#36393f" stroke="#4e5159"/>
  <path d="M716 263l4.500-4.500 4.500 4.500" fill="none" stroke="#dcddde" stroke-opacity=".7" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720.500" y="281" font-size="12" font-weight="700" text-anchor="middle">24</text>
  <path d="M270.500 312.500H752.500" stroke="#4e5159"/>
  <text x="286" y="336" font-weight="700">Allow to filter by task comment</text>
  <text x="286" y="353" font-size="12" fill-opacity=".65">It would be useful to filter tasks by a string included in a</text><text x="286" y="368" font-size="12" fill-opacity=".65">comment, since comments are not part of the export.</text>
  <path d="M288 377h9a1.500 1.500 0 0 1 1.500 1.500v5a1.500 1.500 0 0 1-1.500 1.500h-5l-3 2.500v-2.500h-1a1.500 1.500 0 0 1-1.500-1.500v-5a1.500 1.500 0 0 1 1.500-1.500Z" fill="none" stroke="#dcddde" stroke-opacity=".55" stroke-width="1.200" stroke-linejoin="round"/><text x="304" y="386" font-size="11.500" fill-opacity=".65">4</text><g class="review"><rect x="322" y="372" width="96" height="20" rx="10" fill="#9a9a9a"/><text x="370" y="385.6" fill="#fff" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle">UNDER REVIEW</text></g><g class="planned"><rect x="322" y="372" width="70" height="20" rx="10" fill="#0045ca"/><text x="357" y="385.6" fill="#fff" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle">PLANNED</text></g>
  <rect x="700.500" y="331.500" width="40" height="46" rx="6" fill="#36393f" stroke="#4e5159"/>
  <path d="M716 347l4.500-4.500 4.500 4.500" fill="none" stroke="#dcddde" stroke-opacity=".7" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="before" x="720.500" y="365" font-size="12" font-weight="700" text-anchor="middle">23</text><text class="after" x="720.500" y="365" font-size="12" font-weight="700" fill="#00b242" text-anchor="middle">24</text>
  <rect class="after" x="700.500" y="331.500" width="40" height="46" rx="6" fill="none" stroke="#00b242" stroke-width="1.600" filter="url(#sel-shadow)"/>
  <path class="after" d="M716 347l4.500-4.500 4.500 4.500" fill="none" stroke="#00b242" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270.500 396.500H752.500" stroke="#4e5159"/>
  <text x="286" y="420" font-weight="700">Allow multiple conditions to trigger a status automation</text>
  <text x="286" y="437" font-size="12" fill-opacity=".65">Run an automation only when several statuses are reached.</text>
  <path d="M288 449h9a1.500 1.500 0 0 1 1.500 1.500v5a1.500 1.500 0 0 1-1.500 1.500h-5l-3 2.500v-2.500h-1a1.500 1.500 0 0 1-1.500-1.500v-5a1.500 1.500 0 0 1 1.500-1.500Z" fill="none" stroke="#dcddde" stroke-opacity=".55" stroke-width="1.200" stroke-linejoin="round"/><text x="304" y="458" font-size="11.500" fill-opacity=".65">2</text>
  <rect x="700.500" y="415.500" width="40" height="46" rx="6" fill="#36393f" stroke="#4e5159"/>
  <path d="M716 431l4.500-4.500 4.500 4.500" fill="none" stroke="#dcddde" stroke-opacity=".7" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720.500" y="449" font-size="12" font-weight="700" text-anchor="middle">19</text>
</svg>
