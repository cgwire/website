<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="945" fill="#dcddde" aria-label="Kitsu feedback board: feature requests posted by studios, sorted by votes, with their review status" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" role="img" viewBox="4 6 792 520">
  <style>
    .before { animation: before 8s ease-out infinite }
    .after { opacity: 0; animation: after 8s ease-out infinite }
    .review { animation: review 8s ease-out infinite }
    .planned { opacity: 0; animation: planned 8s ease-out infinite }
    @keyframes before { 0%, 18% { opacity: 1 } 22%, 96% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes after { 0%, 18% { opacity: 0 } 22%, 94% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes review { 0%, 48% { opacity: 1 } 52%, 96% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes planned { 0%, 50% { opacity: 0 } 55%, 94% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .before, .after, .review, .planned { animation: none } .before, .review { opacity: 0 } .after, .planned { opacity: 1 } }
  </style>
  <defs>
    <filter id="card-shadow" width="120%" height="125%" x="-10%" y="-10%">
      <feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".45" stdDeviation="9"/>
    </filter>
    <filter id="sel-shadow" width="140%" height="180%" x="-20%" y="-40%">
      <feDropShadow dx="0" dy="2" flood-color="#00b242" flood-opacity=".35" stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="768" height="484" x="16" y="16" fill="#36393f" filter="url(#card-shadow)" rx="12"/>
  <g font-size="14">
    <text x="48" y="43" fill-opacity=".6">Roadmap</text>
    <text x="136" y="43" fill="#00b242" font-weight="700">Feedback</text>
    <text x="226" y="43" fill-opacity=".6">Changelog</text>
  </g>
  <path stroke="#4e5159" d="M16 58.5h768"/>
  <text x="52" y="92" fill-opacity=".6" font-size="10.5" font-weight="700" letter-spacing="1">BOARDS</text>
  <rect width="204" height="30" x="40" y="104" fill="#40444b" rx="6"/>
  <text x="52" y="124" font-weight="700">Asset and Shot Tables</text>
  <text x="52" y="152" fill-opacity=".75">Casting</text>
  <text x="52" y="180" fill-opacity=".75">General</text>
  <text x="52" y="208" fill-opacity=".75">Integration</text>
  <text x="52" y="236" fill-opacity=".75">People</text>
  <text x="52" y="264" fill-opacity=".75">Production report</text>
  <text x="52" y="292" fill-opacity=".75">Review</text>
  <text x="52" y="320" fill-opacity=".75">Schedule</text>
  <text x="52" y="348" fill-opacity=".75">Task Tables</text>
  <text x="270" y="94" font-size="15" font-weight="700">Asset and Shot Tables</text>
  <rect width="482" height="52" x="270.5" y="108.5" fill="#36393f" stroke="#4e5159" rx="8"/>
  <text x="286" y="139" fill-opacity=".45">Short, descriptive title</text>
  <rect width="92" height="31" x="648" y="119" fill="#00b242" rx="6"/>
  <text x="694" y="139" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Create Post</text>
  <rect width="482" height="300" x="270.5" y="176.5" fill="#36393f" stroke="#4e5159" rx="8"/>
  <text x="286" y="207">Showing <tspan font-weight="700">Top</tspan> posts</text>
  <rect width="128" height="28" x="612.5" y="188.5" fill="#36393f" stroke="#4e5159" rx="6"/>
  <g fill="none" stroke="#dcddde" stroke-linecap="round" stroke-opacity=".55" stroke-width="1.4">
    <circle cx="628" cy="201.5" r="4"/>
    <path d="m631 204.5 3.5 3.5"/>
  </g>
  <text x="642" y="207" fill-opacity=".45" font-size="12">Search...</text>
  <path stroke="#4e5159" d="M270.5 228.5h482"/>
  <text x="286" y="252" font-weight="700">Allow task types to have their own statuses</text>
  <text x="286" y="269" fill-opacity=".65" font-size="12">During a production the number of task statuses keeps growing,</text>
  <text x="286" y="284" fill-opacity=".65" font-size="12">but each task type only uses a few of them.</text>
  <path fill="none" stroke="#dcddde" stroke-linejoin="round" stroke-opacity=".55" stroke-width="1.2" d="M288 293h9a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-5l-3 2.5V301h-1a1.5 1.5 0 0 1-1.5-1.5v-5a1.5 1.5 0 0 1 1.5-1.5Z"/>
  <text x="304" y="302" fill-opacity=".65" font-size="11.5">3</text>
  <rect width="40" height="46" x="700.5" y="247.5" fill="#36393f" stroke="#4e5159" rx="6"/>
  <path fill="none" stroke="#dcddde" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7" stroke-width="1.5" d="m716 263 4.5-4.5 4.5 4.5"/>
  <text x="720.5" y="281" font-size="12" font-weight="700" text-anchor="middle">24</text>
  <path stroke="#4e5159" d="M270.5 312.5h482"/>
  <text x="286" y="336" font-weight="700">Allow to filter by task comment</text>
  <text x="286" y="353" fill-opacity=".65" font-size="12">It would be useful to filter tasks by a string included in a</text>
  <text x="286" y="368" fill-opacity=".65" font-size="12">comment, since comments are not part of the export.</text>
  <path fill="none" stroke="#dcddde" stroke-linejoin="round" stroke-opacity=".55" stroke-width="1.2" d="M288 377h9a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-5l-3 2.5V385h-1a1.5 1.5 0 0 1-1.5-1.5v-5a1.5 1.5 0 0 1 1.5-1.5Z"/>
  <text x="304" y="386" fill-opacity=".65" font-size="11.5">4</text>
  <g class="review">
    <rect width="96" height="20" x="322" y="372" fill="#9a9a9a" rx="10"/>
    <text x="370" y="385.6" fill="#fff" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle">UNDER REVIEW</text>
  </g>
  <g class="planned">
    <rect width="70" height="20" x="322" y="372" fill="#0045ca" rx="10"/>
    <text x="357" y="385.6" fill="#fff" font-size="10" font-weight="700" letter-spacing=".8" text-anchor="middle">PLANNED</text>
  </g>
  <rect width="40" height="46" x="700.5" y="331.5" fill="#36393f" stroke="#4e5159" rx="6"/>
  <path fill="none" stroke="#dcddde" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7" stroke-width="1.5" d="m716 347 4.5-4.5 4.5 4.5"/>
  <text x="720.5" y="365" class="before" font-size="12" font-weight="700" text-anchor="middle">23</text>
  <text x="720.5" y="365" fill="#00b242" class="after" font-size="12" font-weight="700" text-anchor="middle">24</text>
  <rect width="40" height="46" x="700.5" y="331.5" fill="none" stroke="#00b242" stroke-width="1.6" class="after" filter="url(#sel-shadow)" rx="6"/>
  <path fill="none" stroke="#00b242" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m716 347 4.5-4.5 4.5 4.5" class="after"/>
  <path stroke="#4e5159" d="M270.5 396.5h482"/>
  <text x="286" y="420" font-weight="700">Allow multiple conditions to trigger a status automation</text>
  <text x="286" y="437" fill-opacity=".65" font-size="12">Run an automation only when several statuses are reached.</text>
  <path fill="none" stroke="#dcddde" stroke-linejoin="round" stroke-opacity=".55" stroke-width="1.2" d="M288 449h9a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-5l-3 2.5V457h-1a1.5 1.5 0 0 1-1.5-1.5v-5a1.5 1.5 0 0 1 1.5-1.5Z"/>
  <text x="304" y="458" fill-opacity=".65" font-size="11.5">2</text>
  <rect width="40" height="46" x="700.5" y="415.5" fill="#36393f" stroke="#4e5159" rx="6"/>
  <path fill="none" stroke="#dcddde" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7" stroke-width="1.5" d="m716 431 4.5-4.5 4.5 4.5"/>
  <text x="720.5" y="449" font-size="12" font-weight="700" text-anchor="middle">19</text>
</svg>
