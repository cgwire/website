<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 792 436" width="1440" height="793" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#363636" role="img" aria-label="Kitsu production schedule: one bar per task type on a day by day timeline">
  <!-- 8s loop: the end of the animation step is dragged 3 days later, then the rendering step is pushed back by 3 days -->
  <style>
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 8s ease-in-out infinite }
    .cap { animation: cap 8s ease-in-out infinite }
    .push { animation: push 8s ease-in-out infinite }
    .sel { animation: sel 8s ease-in-out infinite }
    @keyframes grow { 0%, 12% { transform: scaleX(0) } 26%, 88% { transform: scaleX(1) } 96%, 100% { transform: scaleX(0) } }
    @keyframes cap { 0%, 12% { transform: translateX(0) } 26%, 88% { transform: translateX(42px) } 96%, 100% { transform: translateX(0) } }
    @keyframes push { 0%, 48% { transform: translateX(0) } 60%, 88% { transform: translateX(42px) } 96%, 100% { transform: translateX(0) } }
    @keyframes sel { 0%, 34% { transform: translateY(0) } 42%, 88% { transform: translateY(36px) } 96%, 100% { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { .grow, .cap, .push, .sel { animation: none } .grow { transform: scaleX(0) } }
  </style>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#363636" flood-opacity=".14"/>
    </filter>
    <filter id="sel-shadow" x="-5%" y="-60%" width="110%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00b242" flood-opacity=".22"/>
    </filter>
    <clipPath id="clip-prod"><circle cx="12" cy="12" r="12"/></clipPath>
    <clipPath id="clip-timeline"><rect x="204" y="100" width="546" height="436"/></clipPath>
    <symbol id="prod" viewBox="0 0 24 24"><g clip-path="url(#clip-prod)"><image href="data:image/png;base64," width="24" height="24" preserveAspectRatio="xMidYMid slice"/></g></symbol>
  </defs>

  <!-- Page card -->
  <rect x="16" y="16" width="768" height="410" rx="12" fill="#fff" filter="url(#card-shadow)"/>

