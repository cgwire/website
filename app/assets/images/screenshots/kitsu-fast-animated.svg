<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 792 520" width="1440" height="945" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#363636" role="img" aria-label="Support chat in Kitsu: a production question answered by the CGWire team a few minutes later">
  <!-- 9s loop: the support agent starts typing, then the answer arrives 22 minutes after the question -->
  <style>
    .agent { opacity: 0; animation: agent 9s ease-out infinite }
    .typing { opacity: 0; animation: typing 9s ease-out infinite }
    .reply { opacity: 0; animation: reply 9s ease-out infinite }
    .dot { animation: dot 1.2s ease-in-out infinite }
    .dot2 { animation-delay: .2s }
    .dot3 { animation-delay: .4s }
    @keyframes agent { 0%, 10% { opacity: 0 } 14%, 92% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes typing { 0%, 10% { opacity: 0 } 14%, 36% { opacity: 1 } 39%, 100% { opacity: 0 } }
    @keyframes reply { 0%, 38% { opacity: 0; transform: translateY(6px) } 43%, 92% { opacity: 1; transform: translateY(0) } 97%, 100% { opacity: 0; transform: translateY(0) } }
    @keyframes dot { 0%, 60%, 100% { opacity: .35 } 30% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .agent, .typing, .reply, .dot { animation: none } .agent, .reply { opacity: 1 } }
  </style>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#363636" flood-opacity=".14"/></filter>
    <clipPath id="clip-widget"><rect x="196" y="16" width="400" height="484" rx="12"/></clipPath>
    <clipPath id="clip-avatar"><circle cx="30" cy="30" r="30"/></clipPath>
    <symbol id="gwen" viewBox="0 0 60 60"><g clip-path="url(#clip-avatar)"><image href="data:image/jpeg;base64," width="60" height="60" preserveAspectRatio="xMidYMid slice"/></g></symbol>
  </defs>
  <!-- Chat widget -->
  <rect x="196" y="16" width="400" height="484" rx="12" fill="#fff" filter="url(#card-shadow)"/>
  <rect x="196" y="16" width="400" height="96" fill="#65ae47" clip-path="url(#clip-widget)"/>
  <rect x="248" y="28" width="150" height="30" rx="15" fill="#457932"/>
  <path d="M276 37.500h13a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-7l-4 3.500v-3.500h-2a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2Z" fill="#fefefe"/>
  <text x="300" y="47.500" fill="#fff" font-size="12" font-weight="700">Conversation</text>
  <g fill="none" stroke="#fefefe" stroke-width="1.800" stroke-linecap="round"><circle cx="443" cy="42" r="4.500"/><path d="M446.500 45.500l4 4"/><path d="M566 37l8 8M574 37l-8 8" stroke-width="1.500"/></g>
  <text x="460" y="47.500" fill="#fff" font-size="12" font-weight="700">Articles</text>
  <use href="#gwen" x="290" y="68" width="30" height="30"/><circle cx="315.8" cy="95.0" r="4.8" fill="#7dc246" stroke="#65ae47" stroke-width="1.5"/>
  <text x="330" y="87.500" fill="#fff" font-weight="700">Gwenaelle from CGWire</text>

  <text x="396" y="140" font-size="11" font-weight="700" text-anchor="middle">Thursday, November 19</text>

  <!-- Question -->
  <rect x="256" y="154" width="324" height="50" rx="10" fill="#f1f2f5"/>
  <text x="270" y="174.500" font-size="12.500">Hello Kitsu team,</text>
  <text x="270" y="192.500" font-size="12.500">Do you know how to import shots data into Kitsu?</text>
  <text x="580" y="220" font-size="10" fill-opacity=".5" text-anchor="end">10:02 - Read</text>

  <!-- Answer -->
  <g class="agent">
    <use href="#gwen" x="212" y="246" width="30" height="30"/><circle cx="237.8" cy="273.0" r="4.8" fill="#7dc246" stroke="#fff" stroke-width="1.5"/>
    <text x="254" y="254" font-size="11" fill-opacity=".55">Gwenaelle</text>
  </g>
  <g class="typing">
    <rect x="254" y="262" width="58" height="32" rx="10" fill="#f1f2f5"/>
    <g fill="#7a7a7a"><circle class="dot" cx="271" cy="278" r="3.500"/><circle class="dot dot2" cx="283" cy="278" r="3.500"/><circle class="dot dot3" cx="295" cy="278" r="3.500"/></g>
  </g>
  <g class="reply">
    <rect x="254" y="262" width="326" height="70" rx="10" fill="#65ae47"/>
    <g fill="#fff" font-size="12.500">
      <text x="268" y="282.500">Hello! Yes, you can use the CSV import utility,</text>
      <text x="268" y="300.500">available via the button in the top right of the</text>
      <text x="268" y="318.500">shot list. Do you need further assistance?</text>
    </g>
    <text x="254" y="348" font-size="10" fill-opacity=".5">10:24</text>
  </g>

  <!-- Composer -->
  <path d="M208 432.500H584" stroke="#e6e6e6"/>
  <text x="216" y="460" fill-opacity=".4">Compose your message...</text>
  <g fill="none" stroke="#363636" stroke-opacity=".45" stroke-width="1.400" stroke-linecap="round">
    <circle cx="223" cy="482" r="6.500"/><path d="M220 484.500a3.500 3.500 0 0 0 6 0"/><path d="M220.800 480v.5M225.200 480v.5"/>
    <path d="M246 478.500v6.500a2.500 2.500 0 0 1-5 0v-8a1.500 1.500 0 0 1 3 0v7"/>
  </g>
</svg>
